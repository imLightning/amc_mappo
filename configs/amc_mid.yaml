# amc_mid -- medium-density scene for the emotion constraint.
#
# WHY THIS EXISTS: the previous "dense" scene put 30 pedestrians in 25 m^2
# (1.20 ped/m^2, mean spacing 0.91 m) while the anisotropic social radius is
# 1.0 m front / 0.6 side / 0.4 rear.  The pedestrians' social circles therefore
# OVERLAPPED each other, so a robot travelling the 2.5 m from start to goal
# necessarily passed through ~2.7 of them: "do not intrude on anyone" was
# geometrically impossible.  Measured on that scene with a trained MAPPO policy
# (success 1.000, closest approach 5 mm), adding a mild avoidance term moved
# D_impact only 18.3 -> 12.5 while collapsing success 1.000 -> 0.023.  Any
# comparison there measures "how much task performance did you sacrifice",
# not "how well did you handle the crowd".
#
# Density sweep (manual avoidance gain 0.6): P=30 -> success 0.000,
# P=20 -> 0.055, P=15 -> 0.133, P=10 -> 0.359.  Socially aware behaviour only
# becomes feasible once the circles stop overlapping, so this recipe uses
# P=14 (0.56 ped/m^2, mean spacing 1.34 m) -- still a genuine crowd (2.3x the
# mean spacing of the old sparse scene) but with navigable gaps.
env:
  n_agents: 2
  n_pedestrians: 14
  n_obstacles: 4
  size: 2.5
  max_robot_speed: 1.3
  pedestrian_max_speed: 0.5

  # --- E-SocialNav emotion model ---
  emotion_enabled: true
  emotion_feedback: true
  emotion_reward_weight: 0.0      # MUST match the MAPPO control exactly; the
                                  # CVaR constraint is supposed to be the ONLY
                                  # difference between the two arms.
  mood_alpha: 0.06                # decay to neutral (tau ~= 16.7 s)
  mood_beta: 1.8                  # intrusion sensitivity
  mood_delta: 0.6                 # courtesy sensitivity
  mood_d_front: 1.0               # ANISOTROPIC social radius (front)
  mood_d_side: 0.6
  mood_d_back: 0.4
  mood_avoid_gain: 2.0
  mood_in_obs: true
  wmp_thresh: -0.2
  mood_slow: 0.5
  mood_turn: 2.5
  mood_dodge: 1.0
  ped_avoid_robot: 0.0

  # --- three-layer emotion cost (see envs/social_nav.py::_update_mood) ---
  # "mood_impact" = the constraint cost is the SINGLE integral of the
  # instantaneous harm q_t.  It replaces "encroachment" (pure geometry, which
  # never read ped_mood at all, so the constraint was not an emotion
  # constraint) and "deficit" (which double-integrated intrusion, because mood
  # is itself an integral -- that made a slow policy look MORE harmful than a
  # fast one and is why the constraint was wrongly believed to reward rushing).
  cost_mode: mood_impact
  impact_on: true
  impact_w_intrusion: 1.0
  impact_w_closing: 0.25
  impact_w_mood: 0.5
  # responsibility attribution: "dynamic" adds closing speed and intrusion to
  # the distance softmax, because the NEAREST robot is not always the harmful
  # one (close-but-slow vs slightly-farther-but-cutting-across at speed).
  resp_mode: dynamic
  resp_sigma_dist: 0.5
  resp_sigma_vel: 0.5
  resp_sigma_intr: 0.5
  # ALIGNED with the MAPPO control: the env reads this key (it changes the
  # central-state dimension), and previously AMC used 8 while MAPPO used 0 --
  # a second uncontrolled difference between the arms on top of the constraint.
  anticipate_k: 0

  max_episode_seconds: 8.0
  goal_tolerance: 0.4
  obs_capacity:
    robots: 4
    peds: 24
    obstacles: 6
reward:
  progress_omega: 15.0
  reach_bonus: 20.0
  collision_robot_robot: 1.5
  collision_robot_ped: 1.2
  collide_with_obstacle: 1.0
  step_penalty: 0.001
  discomfort_weight: 0.0
  discom_sigma: 0.8
  ttc_tau: 0.7
  ttc_weight: 0.0
algo:
  gamma_cost: 0.99
  cost_clip: 3.0
  cost_source: social
  cvar_alpha: 0.2
  cost_target: 0.022            # per-step; scaled by the cost horizon in the trainer.
                                # Set by the QUANTILE rule from plan_emo_add:
                                # C_max = Q_gamma(C_baseline).  The trained MAPPO
                                # baseline sits at cost_ret ~3.22, so 0.022/step
                                # (=2.2 return) is the Q_0.50 "binding" budget --
                                # 32% below baseline, so the constraint must act.
                                # The earlier 0.035 was above baseline and stayed
                                # permanently slack (lambda stayed at 0.026).
                                # Calibrated on P=14: q spans 0.020 (heavy
                                # detour) to 0.056 (straight through), so 0.035
                                # is the midpoint -- demanding but reachable.
  lambda_init: 0.5
  lambda_lr: 0.01               # validated: 0.01 >> 0.05 >> 0.2 in success
  lambda_max: 20.0
  lambda_warmup_steps: 300000   # validated: without warmup the constraint
                                # freezes the policy (success 0.001 vs 0.290)
  kind: mappo
  hidden: 128
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  lr: 4.0e-4
  train_epochs: 5
  num_minibatches: 4
  entropy_coef: 0.01
vec:
  n_parallel_envs: 256
  device: cuda
train:
  rollout_len: 48
  total_steps: 12000000
  num_seeds: 5
  exp_name: amc_mid

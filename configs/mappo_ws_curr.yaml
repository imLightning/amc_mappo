# mappo_ws_curr -- the CURRENT baseline recipe (2026-09-21).
#
# Promoted from the temporary configs/_curr.yaml so that the trained baseline
# (runs/ws_curr) and its training-seed replicates (runs/ws_curr_s1, _s2) share
# ONE durable recipe file.  Content is byte-identical to _curr.yaml.
# Key point: max_robot_accel=1.0 (realistic) but algo.accel_start=100.0 +
# accel_target=1.0 + accel_warmup_steps=55000000 implement the dynamics
# curriculum required by plan_add section 3.5 -- without it the baseline
# plateaus at success ~0.72 (see results/NIGHT_REPORT.md section 8).
env:
  n_agents: 3
  n_pedestrians: 16
  n_obstacles: 4
  robot_radius: 0.3
  ped_radius: 0.25
  max_robot_accel: 1.0
  collision_dist_robot_robot: 0.6
  collision_dist_robot_ped: 0.55
  pedestrian_max_speed: 1.2
  ped_speed_mean: 1.2
  ped_speed_std: 0.25
  ped_speed_min: 0.7
  ped_speed_max: 1.8
  ped_yield_levels:
  - 0.0
  - 0.5
  - 1.0
  ped_yield_probs:
  - 0.3
  - 0.4
  - 0.3
  ped_worker_frac: 0.3
  ped_circulate: true
  ped_clear_goals: true
  hard_separation: true
  ped_steer_mode: blend
  ped_worker_activity: 0.5
  ped_worker_period: 12.0
  anticipate_in_obs: true
  contention_in_obs: true
  perception_k: 16
  contact_stop: true
  cost_fail_penalty: 10.0
  goal_min_dist: 1.5
  goal_max_dist: 6.0
  robot_emotion_enabled: true
  robot_mood_in_obs: true
  robot_mood_alpha: 1.0
  robot_mood_beta: 1.0
  robot_mood_gamma: 0.3
  robot_mood_delta: 0.5
  robot_mood_eta: 0.3
  robot_pressure_radius: 0.8
  size: 5.0
  max_robot_speed: 1.3
  emotion_enabled: true
  emotion_feedback: true
  emotion_reward_weight: 0.0
  mood_alpha: 0.06
  mood_beta: 1.8
  mood_delta: 0.6
  mood_d_front: 1.0
  mood_d_side: 0.6
  mood_d_back: 0.4
  mood_avoid_gain: 2.0
  mood_in_obs: true
  wmp_thresh: -0.2
  mood_slow: 0.5
  mood_turn: 2.5
  mood_dodge: 1.0
  ped_avoid_robot: 0.0
  cost_mode: mood_tail
  impact_on: true
  impact_w_intrusion: 1.0
  impact_w_closing: 0.25
  impact_w_mood: 0.5
  resp_mode: dynamic
  resp_sigma_dist: 0.5
  resp_sigma_vel: 0.5
  resp_sigma_intr: 0.5
  anticipate_k: 0
  max_episode_seconds: 10.0
  goal_tolerance: 0.4
  obs_capacity:
    robots: 4
    peds: 24
    obstacles: 6
reward:
  progress_omega: 15.0
  reach_bonus: 20.0
  collision_robot_robot: 1.5
  collision_robot_ped: 1.2
  collide_with_obstacle: 1.0
  step_penalty: 0.001
  discomfort_weight: 0.0
  discom_sigma: 0.8
  ttc_tau: 0.7
  ttc_weight: 0.0
algo:
  gamma_cost: 0.99
  cost_clip: 3.0
  cost_source: social
  cvar_alpha: 0.2
  cost_target: 0.022
  lambda_init: 0.5
  lambda_lr: 0.01
  lambda_max: 20.0
  lambda_warmup_steps: 300000
  kind: mappo
  hidden: 128
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  lr: 0.0004
  train_epochs: 5
  num_minibatches: 4
  entropy_coef: 0.01
  accel_target: 1.0
  accel_warmup_steps: 55000000
  accel_start: 100.0
vec:
  n_parallel_envs: 256
  device: cuda
train:
  rollout_len: 48
  total_steps: 12000000
  num_seeds: 5
  exp_name: ws_curr
